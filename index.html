<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KCC Systeemstatus</title>

<style>

:root{
    --green:#22c55e;
    --orange:#f59e0b;
    --red:#ef4444;
    --bg:#0f172a;
    --card:#ffffff;
    --blue:#003B5C;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    min-height:100vh;
    color:white;
    padding:25px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.title{
    font-size:48px;
    font-weight:700;
}

.last-update{
    background:rgba(255,255,255,0.1);
    padding:14px 24px;
    border-radius:12px;
    font-size:22px;
}

.summary{
    display:flex;
    justify-content:center;
    gap:25px;
    margin-bottom:25px;
}

.summary-card{
    min-width:220px;
    text-align:center;
    padding:15px;
    border-radius:16px;
    background:white;
    font-size:26px;
    font-weight:bold;
}

.summary-green{
    color:var(--green);
}

.summary-orange{
    color:var(--orange);
}

.summary-red{
    color:var(--red);
}

.alert-banner{
    display:none;
    background:#dc2626;
    color:white;
    font-size:28px;
    font-weight:bold;
    text-align:center;
    padding:16px;
    border-radius:16px;
    margin-bottom:25px;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{opacity:1}
    50%{opacity:.75}
    100%{opacity:1}
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    background:white;
    color:black;
    border-radius:20px;
    padding:20px;
    height:360px;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
}

.system{
    text-align:center;
    font-size:32px;
    font-weight:700;
    color:var(--blue);
}

.light{
    width:140px;
    height:140px;
    border-radius:50%;
    margin:15px auto;
}

.green{
    background:var(--green);
    box-shadow:0 0 40px var(--green);
}

.orange{
    background:var(--orange);
    box-shadow:0 0 40px var(--orange);
}

.red{
    background:var(--red);
    box-shadow:0 0 40px var(--red);
}

.status{
    text-align:center;
    font-size:28px;
    font-weight:800;
    margin-bottom:10px;
}

.online{
    color:var(--green);
}

.warning{
    color:var(--orange);
}

.offline{
    color:var(--red);
}

.info{
    background:#eef2f5;
    border-radius:12px;
    padding:12px;
    font-size:17px;
    line-height:1.7;
}

.label{
    font-weight:bold;
    color:var(--blue);
}

.footer{
    text-align:center;
    margin-top:15px;
    color:#cbd5e1;
    font-size:18px;
}

</style>
</head>
<body>

<div class="header">
    <div class="title">KCC SYSTEEMSTATUS</div>
    <div class="last-update" id="refreshTime">
        Laden...
    </div>
</div>

<div id="alertBanner" class="alert-banner"></div>

<div class="summary">
    <div class="summary-card summary-green" id="onlineCount">
        🟢 0 Online
    </div>

    <div class="summary-card summary-orange" id="warningCount">
        🟠 0 Instabiel
    </div>

    <div class="summary-card summary-red" id="offlineCount">
        🔴 0 Offline
    </div>
</div>

<div class="dashboard" id="dashboard"></div>

<div class="footer">
    Dashboard ververst automatisch elke 30 seconden
</div>

<script>

function systeemNaam(naam){

    if(naam === "planner") return "KCC Planner";

    return naam.charAt(0).toUpperCase() + naam.slice(1);
}

function statusTekst(status){

    if(status === "green") return "ONLINE";
    if(status === "orange") return "INSTABIEL";

    return "OFFLINE";
}

function statusClass(status){

    if(status === "green") return "online";
    if(status === "orange") return "warning";

    return "offline";
}

async function laadDashboard(){

    const response =
    await fetch("status.json?v=" + Date.now());

    const data =
    await response.json();

    const dashboard =
    document.getElementById("dashboard");

    dashboard.innerHTML = "";

    let online = 0;
    let instabiel = 0;
    let offline = 0;

    let offlineSystemen = [];

    for(const [naam,item] of Object.entries(data)){

        if(item.status === "green") online++;
        if(item.status === "orange") instabiel++;
        if(item.status === "red"){
            offline++;
            offlineSystemen.push(
                systeemNaam(naam)
            );
        }

        dashboard.innerHTML += `
        <div class="card">

            <div class="system">
                ${systeemNaam(naam)}
            </div>

            <div class="light ${item.status}">
            </div>

            <div class="status ${statusClass(item.status)}">
                ${statusTekst(item.status)}
            </div>

            <div class="info">

                <div>
                    <span class="label">
                    Gemeld bij:
                    </span>
                    ${item.gemeldBij || "-"}
                </div>

                <div>
                    <span class="label">
                    Door:
                    </span>
                    ${item.door || "-"}
                </div>

                <div>
                    <span class="label">
                    Melding:
                    </span>
                    ${item.melding || "-"}
                </div>

                <div>
                    <span class="label">
                    Laatste update:
                    </span>
                    ${item.update || "-"}
                </div>

            </div>

        </div>
        `;
    }

    document.getElementById(
        "onlineCount"
    ).innerHTML =
        `🟢 ${online} Online`;

    document.getElementById(
        "warningCount"
    ).innerHTML =
        `🟠 ${instabiel} Instabiel`;

    document.getElementById(
        "offlineCount"
    ).innerHTML =
        `🔴 ${offline} Offline`;

    const banner =
    document.getElementById("alertBanner");

    if(offlineSystemen.length > 0){

        banner.style.display = "block";

        banner.innerHTML =
            "🔴 ACTIEVE STORING: " +
            offlineSystemen.join(", ");

    }else{

        banner.style.display = "none";
    }

    document.getElementById(
        "refreshTime"
    ).innerText =
    "Laatste controle: " +
    new Date().toLocaleString("nl-NL");
}

laadDashboard();

setInterval(
    laadDashboard,
    30000
);

</script>

</body>
</html>

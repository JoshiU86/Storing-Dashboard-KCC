<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KCC Systeemstatus</title>

<style>

:root{
    --green:#22c55e;
    --orange:#f59e0b;
    --red:#ef4444;
    --dark:#0f172a;
    --dark2:#1e293b;
    --blue:#003B5C;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:linear-gradient(135deg,var(--dark),var(--dark2));
    color:white;
    min-height:100vh;
    padding:20px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.title{
    font-size:48px;
    font-weight:700;
}

.refresh{
    background:rgba(255,255,255,.1);
    padding:12px 20px;
    border-radius:12px;
    font-size:18px;
}

.banner{
    display:none;
    background:#dc2626;
    color:white;
    font-size:28px;
    font-weight:bold;
    text-align:center;
    padding:16px;
    border-radius:16px;
    margin-bottom:20px;
}

.summary{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:20px;
}

.summary-card{
    background:white;
    color:black;
    padding:15px 30px;
    border-radius:14px;
    min-width:220px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    background:white;
    color:black;
    border-radius:20px;
    padding:20px;
    height:350px;
}

.system{
    text-align:center;
    font-size:34px;
    font-weight:700;
    color:var(--blue);
}

.light{
    width:160px;
    height:160px;
    border-radius:50%;
    margin:15px auto;
}

.green{
    background:var(--green);
    box-shadow:0 0 40px var(--green);
}

.orange{
    background:var(--orange);
    box-shadow:0 0 40px var(--orange);
}

.red{
    background:var(--red);
    box-shadow:0 0 40px var(--red);
}

.status{
    text-align:center;
    font-size:34px;
    font-weight:800;
    margin-bottom:12px;
}

.online{
    color:var(--green);
}

.warning{
    color:var(--orange);
}

.offline{
    color:var(--red);
}

.reported{
    text-align:center;
    background:#eef2f5;
    border-radius:12px;
    padding:12px;
    font-size:22px;
    color:#111827;
}

.label{
    color:var(--blue);
    font-weight:bold;
}

.footer{
    margin-top:15px;
    text-align:center;
    color:#cbd5e1;
    font-size:16px;
}

</style>
</head>
<body>

<div class="header">
    <div class="title">
        KCC SYSTEEMSTATUS
    </div>

    <div class="refresh" id="refreshTime">
        Laden...
    </div>
</div>

<div class="banner" id="banner"></div>

<div class="summary">

    <div class="summary-card" id="onlineTotal">
        🟢 0
    </div>

    <div class="summary-card" id="warningTotal">
        🟠 0
    </div>

    <div class="summary-card" id="offlineTotal">
        🔴 0
    </div>

</div>

<div class="dashboard" id="dashboard"></div>

<div class="footer">
    Automatische verversing iedere 30 seconden
</div>

<script>

function naam(key){

    if(key === "planner")
        return "KCC Planner";

    return key.charAt(0).toUpperCase()
        + key.slice(1);
}

function statusTekst(status){

    if(status === "green")
        return "ONLINE";

    if(status === "orange")
        return "INSTABIEL";

    return "OFFLINE";
}

function statusClass(status){

    if(status === "green")
        return "online";

    if(status === "orange")
        return "warning";

    return "offline";
}

function meldingTekst(type){

    if(type === "it")
        return "IT";

    if(type === "leverancier")
        return "Leverancier";

    return "Niet gemeld";
}

async function laadDashboard(){

    try{

        const response =
            await fetch(
                "status.json?v=" +
                Date.now()
            );

        const data =
            await response.json();

        const dashboard =
            document.getElementById(
                "dashboard"
            );

        dashboard.innerHTML = "";

        let online = 0;
        let warning = 0;
        let offline = 0;

        const offlineSystemen = [];

        Object.entries(data)
        .forEach(([systeem,item])=>{

            if(item.status === "green")
                online++;

            if(item.status === "orange")
                warning++;

            if(item.status === "red"){
                offline++;
                offlineSystemen.push(
                    naam(systeem)
                );
            }

            dashboard.innerHTML += `
            <div class="card">

                <div class="system">
                    ${naam(systeem)}
                </div>

                <div class="light ${item.status}">
                </div>

                <div class="status ${statusClass(item.status)}">
                    ${statusTekst(item.status)}
                </div>

                <div class="reported">
                    <span class="label">
                        Gemeld bij:
                    </span><br>
                    ${meldingTekst(item.melding)}
                </div>

            </div>
            `;
        });

        document.getElementById(
            "onlineTotal"
        ).innerHTML =
        `🟢 ${online}`;

        document.getElementById(
            "warningTotal"
        ).innerHTML =
        `🟠 ${warning}`;

        document.getElementById(
            "offlineTotal"
        ).innerHTML =
        `🔴 ${offline}`;

        const banner =
            document.getElementById(
                "banner"
            );

        if(
            offlineSystemen.length > 0
        ){

            banner.style.display =
                "block";

            banner.innerHTML =
                "🔴 ACTIEVE STORING: "
                +
                offlineSystemen.join(
                    ", "
                );

        }else{

            banner.style.display =
                "none";
        }

        document.getElementById(
            "refreshTime"
        ).innerHTML =
        "Laatste controle: "
        +
        new Date()
        .toLocaleString(
            "nl-NL"
        );

    }
    catch(error){

        console.error(error);
    }
}

laadDashboard();

setInterval(
    laadDashboard,
    30000
);

</script>

</body>
</html>

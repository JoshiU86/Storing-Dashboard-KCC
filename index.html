<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KCC Systeemstatus</title>

<style>
:root{
    --green:#22c55e;
    --orange:#f59e0b;
    --red:#ef4444;
    --bg1:#0f172a;
    --bg2:#1e293b;
    --blue:#003B5C;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    color:white;
    min-height:100vh;
    padding:20px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.title{
    font-size:48px;
    font-weight:700;
}

.refresh{
    background:rgba(255,255,255,.1);
    padding:12px 18px;
    border-radius:12px;
    font-size:16px;
}

.banner{
    display:none;
    background:#dc2626;
    border-radius:14px;
    padding:15px;
    text-align:center;
    font-size:28px;
    font-weight:700;
    margin-bottom:20px;
}

.summary{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:20px;
}

.summary-card{
    width:200px;
    height:75px;
    background:white;
    color:black;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:700;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    min-height:360px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.system{
    color:var(--blue);
    font-size:38px;
    font-weight:700;
}

.light{
    width:140px;
    height:140px;
    border-radius:50%;
    margin:18px 0;
}

.green{
    background:var(--green);
    box-shadow:0 0 35px var(--green);
}

.orange{
    background:var(--orange);
    box-shadow:0 0 35px var(--orange);
}

.red{
    background:var(--red);
    box-shadow:0 0 35px var(--red);
}

.status{
    font-size:34px;
    font-weight:800;
    margin-bottom:20px;
}

.online{
    color:var(--green);
}

.warning{
    color:var(--orange);
}

.offline{
    color:var(--red);
}

.reported{
    margin-top:auto;
    width:100%;
    background:#eef2f5;
    color:#111827;
    border-radius:12px;
    text-align:center;
    padding:12px;
}

.reported-title{
    color:#003B5C;
    font-weight:700;
    font-size:18px;
}

.reported-value{
    margin-top:5px;
    font-size:24px;
    font-weight:700;
}

.footer{
    text-align:center;
    margin-top:15px;
    color:#cbd5e1;
    font-size:14px;
}
</style>
</head>
<body>

<div class="header">
    <div class="title">KCC SYSTEEMSTATUS</div>

    <div class="refresh" id="refreshTime">
        Laden...
    </div>
</div>

<div class="banner" id="banner"></div>

<div class="summary">
    <div class="summary-card" id="onlineTotal">🟢 0</div>
    <div class="summary-card" id="warningTotal">🟠 0</div>
    <div class="summary-card" id="offlineTotal">🔴 0</div>
</div>

<div class="dashboard" id="dashboard"></div>

<div class="footer">
    Automatische verversing elke 30 seconden
</div>

<script>

function naam(key){

    if(key === "planner") return "KCC Planner";
    if(key === "awp") return "AWP";

    return key.charAt(0).toUpperCase() + key.slice(1);
}

function statusTekst(status){

    if(status === "green") return "ONLINE";
    if(status === "orange") return "INSTABIEL";

    return "OFFLINE";
}

function statusClass(status){

    if(status === "green") return "online";
    if(status === "orange") return "warning";

    return "offline";
}

function meldingTekst(type){

    if(type === "it") return "IT";
    if(type === "leverancier") return "LEVERANCIER";

    return "NIET GEMELD";
}

async function laadDashboard(){

    const response =
        await fetch(
            "status.json?v=" + Date.now()
        );

    const data =
        await response.json();

    const dashboard =
        document.getElementById(
            "dashboard"
        );

    dashboard.innerHTML = "";

    let online = 0;
    let warning = 0;
    let offline = 0;

    let storingen = [];

    Object.entries(data).forEach(([systeem,item])=>{

        if(item.status === "green") online++;
        if(item.status === "orange") warning++;

        if(item.status === "red"){
            offline++;
            storingen.push(
                naam(systeem)
            );
        }

        dashboard.innerHTML += `
            <div class="card">

                <div class="system">
                    ${naam(systeem)}
                </div>

                <div class="light ${item.status}">
                </div>

                <div class="status ${statusClass(item.status)}">
                    ${statusTekst(item.status)}
                </div>

                <div class="reported">
                    <div class="reported-title">
                        GEMELD BIJ
                    </div>

                    <div class="reported-value">
                        ${meldingTekst(item.melding)}
                    </div>
                </div>

            </div>
        `;
    });

    document.getElementById(
        "onlineTotal"
    ).innerHTML =
    `🟢 ${online}`;

    document.getElementById(
        "warningTotal"
    ).innerHTML =
    `🟠 ${warning}`;

    document.getElementById(
        "offlineTotal"
    ).innerHTML =
    `🔴 ${offline}`;

    const banner =
        document.getElementById(
            "banner"
        );

    if(storingen.length > 0){

        banner.style.display =
            "block";

        banner.innerHTML =
            "🔴 ACTIEVE STORING: "
            +
            storingen.join(", ");

    }else{

        banner.style.display =
            "none";
    }

    document.getElementById(
        "refreshTime"
    ).innerHTML =
    "Laatste controle: "
    +
    new Date().toLocaleString("nl-NL");
}

laadDashboard();

setInterval(
    laadDashboard,
    30000
);

</script>

</body>
</html>
